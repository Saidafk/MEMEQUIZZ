# Environnement de développement : app Next.js (hot reload) + PostgreSQL.
# Prérequis : copier .env.example en .env, puis `docker compose up`.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: oven/bun:1.4.4-alpine
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev --hostname 0.0.0.0"
    environment:
      # Dans le réseau compose, la base est joignable par le nom du service.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXT_TELEMETRY_DISABLED: 1
      # Le hot reload ne reçoit pas les événements fichiers d'un volume Windows/macOS.
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # node_modules et .next restent dans le conteneur (binaires Linux).
      - node-modules:/app/node_modules
      - next-cache:/app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  node-modules:
  next-cache:
