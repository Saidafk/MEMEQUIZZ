name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types et tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: memequizz
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: memequizz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memequizz -d memequizz_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Types
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Tests d'intégration (migration et seed sur PostgreSQL)
        env:
          TEST_DATABASE_URL: postgres://memequizz:ci@localhost:5432/memequizz_test
        run: |
          bun run db:test 2>&1 | tee integration.log
          # Un test sauté passerait sans rien vérifier : on exige qu'aucun ne le soit.
          if grep -qE '^ *[0-9]+ skip' integration.log; then
            echo "Des tests d'intégration ont été sautés."
            exit 1
          fi

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t memequizz:ci .

      - name: Vérifier que l'application répond sur le port 3000
        run: |
          docker run -d --name app -p 3000:3000 memequizz:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/ > /dev/null && exit 0
            sleep 1
          done
          docker logs app
          exit 1

      - name: Vérifier que le conteneur ne tourne pas en root
        run: test "$(docker exec app id -u)" != "0"

  compose:
    name: docker compose (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le .env
        run: cp .env.example .env

      - name: Démarrer les services
        run: docker compose up -d

      - name: Vérifier que l'app et la base répondent
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://localhost:3000/ > /dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:3000/ > /dev/null
          docker compose exec -T db pg_isready -U memequizz -d memequizz

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Arrêter les services
        if: always()
        run: docker compose down -v
