name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types et tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: memequizz
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: memequizz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memequizz -d memequizz_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Types
        run: bun run typecheck

      - name: Tests
        run: bun run test

      # Tous les tests (unitaires et intégration sur PostgreSQL) avec la couverture (SCRUM-64). Seul
      # cet appel voit la base, donc seul il mesure tout le code testé.
      - name: Tests d'intégration et couverture (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgres://memequizz:ci@localhost:5432/memequizz_test
        run: |
          # Sans pipefail, l'échec de bun serait masqué par le code de sortie de tee.
          set -o pipefail
          bun run test:couverture 2>&1 | tee integration.log
          # Un test sauté passerait sans rien vérifier : on exige qu'aucun ne le soit.
          if grep -qE '^ *[0-9]+ skip' integration.log; then
            echo "Des tests d'intégration ont été sautés."
            exit 1
          fi

      # Seuil global (scripts/verifier-couverture.ts) : la CI échoue si la couverture baisse.
      - name: Seuil de couverture
        run: bun run couverture:seuil

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: coverage/lcov.info
          if-no-files-found: ignore

  # Parcours complet d'un joueur et axe (SCRUM-62, SCRUM-63) sur le build de production, avec une
  # base dédiée : migrations + seed, puis Playwright démarre `bun run start`.
  e2e:
    name: Tests E2E et accessibilité
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: memequizz
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: memequizz_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memequizz -d memequizz_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://memequizz:ci@localhost:5432/memequizz_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Installer Chromium
        run: bunx playwright install --with-deps chromium

      - name: Préparer la base (migrations et mèmes)
        run: |
          bun run db:migrate
          bun run db:seed

      - name: Construire
        run: bun run build

      - name: Tests E2E et axe
        run: bun run test:e2e

      - name: Publier le rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t memequizz:ci .

      - name: Vérifier que l'application répond sur le port 3000
        run: |
          docker run -d --name app -p 3000:3000 memequizz:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/ > /dev/null && exit 0
            sleep 1
          done
          docker logs app
          exit 1

      - name: Vérifier que le conteneur ne tourne pas en root
        run: test "$(docker exec app id -u)" != "0"

  compose:
    name: docker compose (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le .env
        run: cp .env.example .env

      - name: Démarrer les services
        run: docker compose up -d

      - name: Vérifier que l'app et la base répondent
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://localhost:3000/ > /dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:3000/ > /dev/null
          docker compose exec -T db pg_isready -U memequizz -d memequizz

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Arrêter les services
        if: always()
        run: docker compose down -v
